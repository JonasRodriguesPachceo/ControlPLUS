version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                UID: 1000
                GID: 33
        image: controlplus-app:latest
        container_name: backend
        env_file: .env
        restart: unless-stopped
        environment:
            APP_ENV: ${APP_ENV:-production}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            APP_KEY: ${APP_KEY:-}
            DB_CONNECTION: ${DB_CONNECTION:-mysql}
            DB_HOST: ${DB_HOST:-db}
            DB_PORT: ${DB_PORT:-3306}
            DB_DATABASE: ${DB_DATABASE:-controlplus}
            DB_USERNAME: ${DB_USERNAME:-controlplus}
            DB_PASSWORD: ${DB_PASSWORD:-controlplus_pass}
            LOG_CHANNEL: ${LOG_CHANNEL:-stack}
            LOG_LEVEL: ${LOG_LEVEL:-info}
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/var/www/html:cached
            - app_storage:/var/www/html/storage
        ports:
            - "5173:5173"
        networks:
            - controlplus

    web:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        image: controlplus-web:latest
        container_name: frontend
        restart: unless-stopped
        depends_on:
            - app
        ports:
            - "${CONTROLPLUS_HTTP_PORT:-8080}:80"
        volumes:
            - .:/var/www/html:cached
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O - http://127.0.0.1/api/health >/dev/null || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - controlplus

    db:
        image: mysql:8.0
        container_name: db
        restart: unless-stopped
        command: >
            --default-authentication-plugin=mysql_native_password
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-controlplus}
            MYSQL_USER: ${DB_USERNAME:-controlplus}
            MYSQL_PASSWORD: ${DB_PASSWORD:-controlplus_pass}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - controlplus

volumes:
    db_data:
    app_storage:

networks:
    controlplus:
        driver: bridge
