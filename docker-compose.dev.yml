services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-33}
    env_file: .env
    volumes:
      - .:/var/www/html:cached

  web:
    env_file: .env
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    env_file: .env
    ports:
      - "3306:3306"
